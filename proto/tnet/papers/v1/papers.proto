syntax = "proto3";

package tnet.papers.v1;

option go_package = "github.com/kavos113/tnet/services/papers-server/internal/gen/tnet/papers/v1;papersv1";

service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}

service LibraryService {
  rpc LoadGlobalConfig(LoadGlobalConfigRequest) returns (PapersGlobalConfig);
  rpc SaveGlobalConfig(SaveGlobalConfigRequest) returns (SaveGlobalConfigResponse);
  rpc LoadLibraryConfig(LoadLibraryConfigRequest) returns (PapersLibraryConfig);
  rpc SaveLibraryConfig(SaveLibraryConfigRequest) returns (SaveLibraryConfigResponse);
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse);
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse);
}

service PaperService {
  rpc ListPapers(ListPapersRequest) returns (ListPapersResponse);
  rpc GetPaper(GetPaperRequest) returns (GetPaperResponse);
  rpc CreatePaperFromLocalPdf(CreatePaperFromLocalPdfRequest) returns (ImportPaperResponse);
  rpc CreatePaperFromPdfBytes(CreatePaperFromPdfBytesRequest) returns (ImportPaperResponse);
  rpc SaveNote(SaveNoteRequest) returns (GetPaperResponse);
  rpc ListPaperAiOutputs(ListPaperAiOutputsRequest) returns (ListPaperAiOutputsResponse);
  rpc SavePaperAiOutput(SavePaperAiOutputRequest) returns (PaperAiOutput);
}

service TagService {
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc UpsertTag(UpsertTagRequest) returns (PaperTag);
  rpc AttachTag(AttachTagRequest) returns (GetPaperResponse);
  rpc DetachTag(DetachTagRequest) returns (GetPaperResponse);
}

service PdfService {
  rpc LoadPdfBytes(LoadPdfBytesRequest) returns (LoadPdfBytesResponse);
}

message CheckRequest {}

message CheckResponse {
  string status = 1;
  string version = 2;
}

message PapersGlobalConfig {
  repeated string library_roots = 1;
  string active_library_root = 2;
  string last_opened_directory = 3;
}

message PapersLibraryConfig {
  string list_density = 1;
  string pdf_zoom_mode = 2;
  string note_editor_mode = 3;
  int32 note_auto_save_debounce_ms = 4;
  string note_editor_font_family = 5;
  int32 note_editor_font_size = 6;
  string note_preview_font_family = 7;
  int32 note_preview_font_size = 8;
}

message LoadGlobalConfigRequest {
  string user_data_dir = 1;
}

message SaveGlobalConfigRequest {
  string user_data_dir = 1;
  PapersGlobalConfig config = 2;
}

message SaveGlobalConfigResponse {}

message LoadLibraryConfigRequest {
  string library_root = 1;
}

message SaveLibraryConfigRequest {
  string library_root = 1;
  PapersLibraryConfig config = 2;
}

message SaveLibraryConfigResponse {}

message ListLibrariesRequest {
  string user_data_dir = 1;
}

message LibraryInfo {
  string root_path = 1;
  string name = 2;
  bool is_active = 3;
}

message ListLibrariesResponse {
  repeated LibraryInfo libraries = 1;
  string active_library_root = 2;
}

message ListDirectoriesRequest {
  string library_root = 1;
}

message DirectoryNode {
  string name = 1;
  string relative_path = 2;
  repeated DirectoryNode children = 3;
}

message ListDirectoriesResponse {
  DirectoryNode root = 1;
}

message PaperSummary {
  string id = 1;
  string title = 2;
  repeated string authors = 3;
  int32 published_year = 4;
  string venue = 5;
  repeated string tags = 6;
  bool has_pdf = 7;
}

message PaperDetail {
  string id = 1;
  string title = 2;
  repeated string authors = 3;
  int32 published_year = 4;
  string venue = 5;
  repeated string tags = 6;
  bool has_pdf = 7;
  string abstract = 8;
  string doi = 9;
  string arxiv_id = 10;
  string url = 11;
  string pdf_path = 12;
  string directory_path = 13;
  string note_content = 14;
  repeated PaperAiOutput ai_outputs = 15;
}

message PaperAiOutput {
  string paper_id = 1;
  string operation = 2;
  string input_mode = 3;
  string target_language = 4;
  string provider = 5;
  string model = 6;
  string content = 7;
  string updated_at = 8;
}

message ListPapersRequest {
  string library_root = 1;
  string directory_path = 2;
  string query = 3;
  repeated string tag_ids = 4;
}

message ListPapersResponse {
  repeated PaperSummary papers = 1;
}

message GetPaperRequest {
  string library_root = 1;
  string paper_id = 2;
}

message GetPaperResponse {
  PaperDetail paper = 1;
}

message ImportPaperResponse {
  PaperDetail paper = 1;
  bool already_exists = 2;
  string duplicate_field = 3;
}

message CreatePaperFromLocalPdfRequest {
  string library_root = 1;
  string source_path = 2;
  string title = 3;
  repeated string authors = 4;
  string abstract = 5;
  int32 published_year = 6;
  string venue = 7;
  string doi = 8;
  string arxiv_id = 9;
  string url = 10;
  string directory_path = 11;
  repeated string tags = 12;
}

message CreatePaperFromPdfBytesRequest {
  string library_root = 1;
  string file_name = 2;
  bytes pdf_bytes = 3;
  string title = 4;
  repeated string authors = 5;
  string abstract = 6;
  int32 published_year = 7;
  string venue = 8;
  string doi = 9;
  string arxiv_id = 10;
  string url = 11;
  string directory_path = 12;
  repeated string tags = 13;
}

message PaperTag {
  string id = 1;
  string name = 2;
  string color = 3;
}

message ListTagsRequest {
  string library_root = 1;
}

message ListTagsResponse {
  repeated PaperTag tags = 1;
}

message UpsertTagRequest {
  string library_root = 1;
  string name = 2;
  string color = 3;
}

message AttachTagRequest {
  string library_root = 1;
  string paper_id = 2;
  string tag_id = 3;
}

message DetachTagRequest {
  string library_root = 1;
  string paper_id = 2;
  string tag_id = 3;
}

message SaveNoteRequest {
  string library_root = 1;
  string paper_id = 2;
  string content = 3;
}

message ListPaperAiOutputsRequest {
  string library_root = 1;
  string paper_id = 2;
}

message ListPaperAiOutputsResponse {
  repeated PaperAiOutput outputs = 1;
}

message SavePaperAiOutputRequest {
  string library_root = 1;
  PaperAiOutput output = 2;
}

message LoadPdfBytesRequest {
  string library_root = 1;
  string pdf_path = 2;
}

message LoadPdfBytesResponse {
  bytes bytes = 1;
}
