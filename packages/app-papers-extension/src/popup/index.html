<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TNet Paper Connector</title>
    <style>
      html,
      body {
        width: 460px;
        min-height: 640px;
        margin: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #root {
        box-sizing: border-box;
        min-height: 560px;
        padding: 16px;
      }

      .paper-popup {
        color: #1f2933;
        display: grid;
        gap: 14px;
      }

      .paper-popup h1,
      .paper-popup h2,
      .paper-popup p {
        margin: 0;
      }

      .paper-popup h1 {
        font-size: 18px;
        font-weight: 650;
      }

      .paper-popup h2 {
        font-size: 13px;
        font-weight: 650;
      }

      .paper-popup-message {
        align-content: start;
      }

      .paper-popup-card {
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .paper-popup-metadata {
        display: grid;
        gap: 6px 10px;
        grid-template-columns: 64px minmax(0, 1fr);
        margin: 0;
      }

      .paper-popup-metadata dt {
        color: #627d98;
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
      }

      .paper-popup-metadata dd {
        font-size: 12px;
        line-height: 1.35;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .paper-popup-form {
        display: grid;
        gap: 12px;
      }

      .paper-popup-field {
        display: grid;
        gap: 5px;
        font-size: 12px;
        font-weight: 650;
      }

      .paper-popup-field input,
      .paper-popup-field select,
      .paper-popup-field textarea {
        border: 1px solid #bcccdc;
        border-radius: 5px;
        box-sizing: border-box;
        font: inherit;
        font-weight: 400;
        min-height: 32px;
        padding: 6px 8px;
        width: 100%;
      }

      .paper-popup-field textarea {
        min-height: 128px;
        resize: vertical;
      }

      .paper-popup-checkbox {
        align-items: center;
        display: flex;
        gap: 8px;
        font-size: 12px;
      }

      .paper-popup-primary {
        background: #1465c0;
        border: 0;
        border-radius: 5px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        min-height: 34px;
        padding: 8px 12px;
      }

      .paper-popup-secondary {
        background: #f0f4f8;
        border: 1px solid #bcccdc;
        border-radius: 5px;
        color: #243b53;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        min-height: 32px;
        padding: 7px 10px;
      }

      .paper-popup-progress {
        color: #627d98;
        font-size: 12px;
      }

      .paper-popup-primary:disabled {
        background: #9fb3c8;
        cursor: default;
      }

      .paper-popup-error {
        background: #fff3f0;
        border: 1px solid #ffb4a2;
        border-radius: 5px;
        color: #9f1d12;
        font-size: 12px;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
